<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFSI Topic Radar</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d23;--muted:#667085;--line:#e4e7ec;--accent:#1d6fdc;--ok:#157f3b;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f26;--text:#eceff3;--muted:#98a2b3;--line:#2c323b;--accent:#6ea8fe;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
h2{margin:32px 0 12px;font-size:20px}
h3{margin:20px 0 8px;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px}
.num{font-weight:700;font-size:20px;color:var(--accent);min-width:26px}
.card a{color:var(--text);font-weight:600;text-decoration:none}
.card a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;margin-right:6px}
.empty{color:var(--muted);font-size:14px}
details{margin-top:36px;color:var(--muted);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>BFSI Topic Radar</h1>
  <p class="sub" id="updated">Loading...</p>
  <h2>Top 5 trending right now</h2><div id="top"></div>
  <h2>Industry-specific topics</h2><div id="industry"></div>
  <h2>Secondary topics worth knowing</h2><div id="secondary"></div>
  <details><summary>Feed health (for the owner)</summary><div id="health"></div></details>
</main>
<script>
function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e;}
function card(i,n){
  var d=el("div","card");
  if(n) d.appendChild(el("div","num",n));
  var b=el("div");
  var a=el("a",null,i.title); a.href=i.url; a.target="_blank"; a.rel="noopener noreferrer";
  var m=el("div","meta");
  if(i.official) m.appendChild(el("span","tag","Official"));
  m.appendChild(el("span","tag","Covered by "+i.source_count+" source"+(i.source_count>1?"s":"")));
  m.appendChild(document.createTextNode(i.sources.join(", ")+" | "+i.category));
  b.appendChild(a); b.appendChild(m); d.appendChild(b); return d;
}
function empty(p){p.appendChild(el("p","empty","Nothing new here yet."));}
fetch("data.json?"+Date.now()).then(function(r){return r.json();}).then(function(d){
  document.getElementById("updated").textContent="Last updated: "+d.updated;
  var top=document.getElementById("top");
  d.top.length ? d.top.forEach(function(i,k){top.appendChild(card(i,k+1));}) : empty(top);
  var ind=document.getElementById("industry");
  Object.keys(d.industry).forEach(function(c){
    ind.appendChild(el("h3",null,c));
    d.industry[c].length ? d.industry[c].forEach(function(i){ind.appendChild(card(i));}) : empty(ind);
  });
  var sec=document.getElementById("secondary");
  d.secondary.length ? d.secondary.forEach(function(i){sec.appendChild(card(i));}) : empty(sec);
  var h=document.getElementById("health");
  (d.feed_status||[]).forEach(function(s){
    var p=el("div",s.ok?"ok":"bad",(s.ok?"OK: ":"FAILED: ")+s.name+" ("+s.note+")"); h.appendChild(p);
  });
}).catch(function(){document.getElementById("updated").textContent="No data yet. Run the robot once (see setup steps).";});
</script>
</body>
</html>
