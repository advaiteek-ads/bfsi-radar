name: Update BFSI topics
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - run: |
          git config user.name "bfsi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Update topics"
          git push
